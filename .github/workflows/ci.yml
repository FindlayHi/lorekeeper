# Run the tests on every pull request and every push to main.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencies
        run: python -m pip install -r requirements.txt -c packaging/constraints.txt
      - name: Tests
        run: python -m pytest -q tests
        env: { PYTHONUTF8: '1' }
