# Run the tests on every pull request and every push to main.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencies
        run: python -m pip install -r requirements.txt -c packaging/constraints.txt
      - name: Tests
        run: python -m pytest -q tests
        env: { PYTHONUTF8: '1' }
