# Build the Windows installer and attach it to the GitHub release, on every version tag (v1.2.3).
name: Release installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions: {}
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # attach the installer to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $app = (Select-String -Path telemetry.py -Pattern "^VERSION = '(.+)'").Matches[0].Groups[1].Value
          if ($tag -ne $app) { throw "Tag ${tag} but telemetry.VERSION is ${app}, so the app would keep offering itself as an update" }
      - name: Dependencies
        run: python -m pip install -r requirements.txt -c packaging/constraints.txt pyinstaller   # exact versions: the release builds what was tested
      - name: Tests
        run: python -m pytest -q tests
        env: { PYTHONUTF8: '1' }
      - name: Bundle (PyInstaller)
        run: python -m PyInstaller packaging/lorekeeper.spec --noconfirm --log-level WARN
      - name: Self-test the bundle
        shell: pwsh
        run: |
          $p = Start-Process dist\Lorekeeper\Lorekeeper.exe -ArgumentList '--selftest','--ci' -PassThru -Wait
          Get-Content "$env:APPDATA\Lorekeeper\app.log"
          if ($p.ExitCode -ne 0) { throw "self-test failed" }
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v'); if ($v -notmatch '^\d') { $v = '0.0.0-dev' }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source; if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Q "/DAppVersion=$v" packaging\lorekeeper.iss
          Copy-Item "dist\Lorekeeper-Setup-$v.exe" dist\Lorekeeper-Setup.exe   # a fixed name: releases/latest/download/Lorekeeper-Setup.exe
          # the app checks the download against this before it runs it (updater.py); sha256sum format: "<hex>  <name>"
          $hash = (Get-FileHash dist\Lorekeeper-Setup.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist\Lorekeeper-Setup.exe.sha256 -Value "$hash  Lorekeeper-Setup.exe" -Encoding ascii
          Get-ChildItem dist\*.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/Lorekeeper-Setup-*.exe
            dist/Lorekeeper-Setup.exe
            dist/Lorekeeper-Setup.exe.sha256
          generate_release_notes: true
      - name: Keep the build (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lorekeeper-Setup
          path: dist/Lorekeeper-Setup-*.exe
